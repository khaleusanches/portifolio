<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Título e descrição de partida. Cada rota sobrescreve os seus: no navegador
         pelo componente Metadados, e no HTML servido pela pré-renderização do build. -->
    <title>KH Softwares — Sistemas sob medida, automação e aplicativos</title>
    <meta name="description" content="Desenvolvemos sistemas, automações e aplicativos sob medida para empresas: ERPs, integrações, websites e apps. Veja os trabalhos já entregues e peça um orçamento." />
    <script>
      /*
        Decide o tema antes da primeira pintura, senão a tela pisca no tema errado
        até o React montar.

        A regra está duplicada de src/theme/tema.js de propósito: este script roda
        antes de existir bundle para importar. A duplicação é pequena e a chave que
        os dois compartilham está travada por teste (tema.test.js).
      */
      (function () {
        try {
          var salvo = localStorage.getItem("tema")
          var escolhaValida = salvo === "light" || salvo === "dark"
          var sistemaEscuro =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          document.documentElement.setAttribute(
            "data-theme",
            escolhaValida ? salvo : sistemaEscuro ? "dark" : "light"
          )
        } catch (erro) {
          document.documentElement.setAttribute("data-theme", "light")
        }
      })()
    </script>
    <noscript>
      <!-- O build pré-renderiza a página, então o conteúdo está no documento; mas as
           entradas ao rolar nascem com opacidade zero e só o JavaScript as revela.
           Sem script, o visitante leria uma página em branco sobre um texto que já
           está ali. -->
      <style>
        [style*="opacity:0"], [style*="opacity: 0"] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root" ></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
